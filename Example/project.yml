name: RiviumAbTestingExample
options:
  bundleIdPrefix: co.rivium.abtesting
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

packages:
  RiviumAbTesting:
    path: ../RiviumAbTesting

targets:
  RiviumAbTestingExample:
    type: application
    platform: iOS
    sources:
      - RiviumAbTestingExample
    dependencies:
      - package: RiviumAbTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        SWIFT_VERSION: "5.0"
        PRODUCT_BUNDLE_IDENTIFIER: co.rivium.abtesting.example
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
